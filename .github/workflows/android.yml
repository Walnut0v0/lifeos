name: Android PoC
on:
  push:
    branches: [phase01-poc]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        working-directory: android
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Source, merged manifest and APK privacy audit
        run: |
          python3 tools/audit.py android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          python3 tools/audit.py android/app/build/outputs/apk/debug/app-debug.apk "$AAPT"
          mkdir -p deliverables
          cp android/app/build/outputs/apk/debug/app-debug.apk deliverables/lifeos-focus-lab-v0.1.1.apk
          cd deliverables
          sha256sum lifeos-focus-lab-v0.1.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-focus-lab-v0.1.1
          path: deliverables/
          retention-days: 7
