name: Android verification
on:
  push:
    branches: [phase01-poc, phase02-whitelist, phase03-app-categories, phase04-online-plan, phase05-google-sheets]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: lab
            task: Lab
            audit: ''
          - flavor: online
            task: Online
            audit: '--online'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint and release manifest
        working-directory: android
        run: bash gradlew --no-daemon test${{ matrix.task }}DebugUnitTest lint${{ matrix.task }}Debug assemble${{ matrix.task }}Debug process${{ matrix.task }}ReleaseMainManifest
      - name: Independent permissions and privacy audit
        env:
          FLAVOR: ${{ matrix.flavor }}
          AUDIT: ${{ matrix.audit }}
        run: |
          python3 tools/audit.py $AUDIT android/app/build/intermediates/merged_manifests/${FLAVOR}Debug/process${{ matrix.task }}DebugManifest/AndroidManifest.xml
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          python3 tools/audit.py $AUDIT android/app/build/outputs/apk/${FLAVOR}/debug/app-${FLAVOR}-debug.apk "$AAPT"
          python3 tools/check_release_manifest.py "$FLAVOR"
          mkdir -p deliverables
          cp android/app/build/outputs/apk/${FLAVOR}/debug/app-${FLAVOR}-debug.apk deliverables/lifeos-${FLAVOR}-v0.4.1.apk
          cd deliverables
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-${{ matrix.flavor }}-v0.4.1
          path: deliverables/
          retention-days: 7
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s bridge -p 'test_*.py'
